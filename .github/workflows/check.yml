name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Nix checks and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate source and build all checks
        run: nix flake check --no-update-lock-file --print-build-logs

      - name: Build deployment artifacts without activation
        run: nix build --no-link --no-update-lock-file .#arch-workstation .#arch-switch .#runnerctl

      - name: Ensure validation left the checkout unchanged
        run: git diff --exit-code
