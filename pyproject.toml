[project]
name = "nix-config-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tomli-w", "rich"]

[tool.pyright]
include = ["checks", "lib", "modules", "platforms"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
executionEnvironments = [
  { root = "platforms/arch/system", extraPaths = ["platforms/arch/system"] },
  { root = "modules/gitlab-runner", extraPaths = ["modules/gitlab-runner"] },
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F"]
